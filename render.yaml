services:
  - type: web
    name: taxi-dispatch-flask
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: NETLIFY_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: taxi-dispatch-db
          property: connectionString

databases:
  - name: taxi-dispatch-db
    databaseName: taxi_dispatch
    user: taxi_dispatch
    plan: free
